# This project is Apache-2.0, so a strong copyleft licence cannot come in.
allowed = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "0BSD"]
review = ["MPL-2.0", "LGPL-2.1-or-later", "LGPL-3.0-or-later"]
refused = [
  "GPL-2.0-only", "GPL-2.0-or-later", "GPL-3.0-only", "GPL-3.0-or-later",
  "AGPL-3.0-only", "AGPL-3.0-or-later", "SSPL-1.0", "BUSL-1.1",
]
vendored = ["vendor/**"]
