<form class="hw-form" action="/settings" method="post">
  <label for="display-name">Display name</label>
  <input id="display-name" name="display_name" type="text" autocomplete="nickname">
  <div class="hw-row">
    <span class="hw-row__title">Changes apply the next time you sign in.</span>
    <span class="hw-row__actions">
      <button type="submit" class="hw-btn hw-btn--primary">Save changes</button>
    </span>
  </div>
</form>
