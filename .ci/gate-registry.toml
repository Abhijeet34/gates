# The decision is in the declaration: the old statement moved to `was`, and a file still states it.
[[gate]]
id = "fact-change-sweep"
surface = "Fact changes"
gates = ["run/change-gates.py"]
test = ".ci/test-change-gates.py"
suite = "shell"
command = "run/change-gates.py"
red = '''
git init -q -b main && mkdir -p .github
printf '[[fact]]\nid = "pin"\nnow = "tool 1.2"\nwas = []\ndecision = "none yet"\n' > .github/changes.toml
echo 'Pinned to tool 1.2.' > README.md && git add -A && git commit -qm base && git tag base
printf '[[fact]]\nid = "pin"\nnow = "tool 1.3"\nwas = ["tool 1.2"]\ndecision = "decided in review"\n' > .github/changes.toml
git commit -qam change
'''
clean = '''
git init -q -b main && mkdir -p .github
printf '[[fact]]\nid = "pin"\nnow = "tool 1.2"\nwas = []\ndecision = "none yet"\n' > .github/changes.toml
echo 'Pinned to tool 1.2.' > README.md && git add -A && git commit -qm base && git tag base
printf '[[fact]]\nid = "pin"\nnow = "tool 1.3"\nwas = ["tool 1.2"]\ndecision = "decided in review"\n' > .github/changes.toml
echo 'Pinned to tool 1.3.' > README.md && git commit -qam change
'''
run = 'python3 "$GATE" facts --base base .'
finding = "facts: README.md:1: still states 'tool 1.2', superseded (pin; decided in review)"

# Slop a tree can answer, one row per rule over one script, in shadow and scoped to the files
# each judges; README.md, "The slop rows". With no --base a row judges every file under the
# working directory, so each input is a few files and no repository.
[[gate]]
id = "slop-tests-source-text"
