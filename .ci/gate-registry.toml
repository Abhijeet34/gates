# Every gate this repository ships, the surface it guards, and the inputs that
# prove it by execution; .ci/gates-proof.py runs them.
#
# `command` is the gate itself, a file. `red` and `clean` are bash that build an
# input in an empty working directory; `run` then invokes the gate on it, and
# its exit status is the verdict. The proof requires red to exit non-zero with
# `finding` in its output and clean to exit 0, then replaces `command` with
# one that exits 0 and requires red to pass, so a `run` that decides the
# verdict without the gate is refused. Each case sees ROOT (the tree under
# proof), GATE (the command's path in it; a run/ script runs as
# `bash -e "$GATE"`, as its workflow runs it) and a git with no global or
# system config and a noreply identity.
#
# `test` is the gate's fuller regression suite and `suite` the check.sh suite
# that must run it. A gate file found on disk and named neither in a `gates`
# list nor in `[[exempt]]` fails the proof too.

[[gate]]
id = "checks-verdict"
surface = "PR checks"
gates = [".ci/checks-verdict.sh", ".github/workflows/ci.yml"]
test = ".ci/test-checks-verdict.sh"
suite = "shell"
command = ".ci/checks-verdict.sh"
red = '''echo '{"shell":{"result":"skipped"},"python":{"result":"skipped"}}' > needs.json'''
clean = '''echo '{"shell":{"result":"success"},"python":{"result":"success"}}' > needs.json'''
run = 'bash "$GATE" < needs.json'
finding = "a gate did not run, or did not pass"

[[gate]]
id = "workflow-policy"
surface = "Infra and CI config"
gates = [".ci/test-workflow-policy.sh"]
test = ".ci/test-workflow-policy.sh"
suite = "shell"
command = ".ci/test-workflow-policy.sh"
red = '''mkdir wf && printf 'on:\n  pull_request_target:\n' > wf/ci.yml'''
clean = '''mkdir wf && printf 'on:\n  pull_request:\n' > wf/ci.yml'''
run = 'bash "$GATE" "$PWD/wf"'
finding = "ci.yml:2:  pull_request_target:"

[[gate]]
id = "dependency-advisories"
surface = "Dependencies"
gates = [
  ".github/workflows/shared-dependency-advisories.yml", "run/dependency-advisories.sh",
  "run/dependency-advisories/alerts.sh", "run/dependency-advisories/compare.sh",
  "run/dependency-advisories/judge.sh",
]
test = ".ci/test-dependency-advisories.sh"
suite = "shell"
command = "run/dependency-advisories/judge.sh"
red = '''
echo '[{"security_advisory": {"ghsa_id": "GHSA-aaaa-bbbb-cccc", "severity": "high"},
  "dependency": {"scope": "runtime", "package": {"name": "left-pad"}, "manifest_path": "package-lock.json"}}]' > alerts.json
'''
clean = '''
echo '[{"security_advisory": {"ghsa_id": "GHSA-aaaa-bbbb-cccc", "severity": "medium"},
  "dependency": {"scope": "runtime", "package": {"name": "left-pad"}, "manifest_path": "package-lock.json"}}]' > alerts.json
'''
run = '''
ALERTS_JSON=alerts.json COMPARE_JSON=none EVENT_NAME=push SEVERITY_FLOOR=high \
  FAIL_ON_DEVELOPMENT=false DEFERRALS_PATH=deferrals.yml bash -e "$GATE"
'''
finding = "are neither fixed nor recorded in deferrals.yml"

[[gate]]
id = "guard-generated-files"
surface = "PR checks"
gates = [".github/workflows/shared-guard-generated-files.yml", "run/guard-generated-files.sh"]
test = ".ci/test-guard-generated-files.sh"
suite = "shell"
command = "run/guard-generated-files.sh"
red = '''
git init -q -b main && echo '# Changelog' > CHANGELOG.md && echo hi > README.md
git add -A && git commit -qm base && git tag base
echo '- a hand-written entry' >> CHANGELOG.md && git commit -qam edit
'''
clean = '''
git init -q -b main && echo '# Changelog' > CHANGELOG.md && echo hi > README.md
git add -A && git commit -qm base && git tag base
echo more >> README.md && git commit -qam edit
'''
run = 'BASE_SHA=$(git rev-parse base) HEAD_SHA=$(git rev-parse HEAD) ALLOW_FIRST_ADD= bash -e "$GATE"'
finding = "This PR modifies release-please-generated files: CHANGELOG.md"

[[gate]]
id = "no-mistakes-required"
surface = "PR checks"
gates = [".github/workflows/shared-no-mistakes-required.yml", "run/no-mistakes-required.sh"]
test = ".ci/test-no-mistakes-required.sh"
suite = "shell"
command = "run/no-mistakes-required.sh"
# `gh` serves the body the step reads live; `sleep` is stubbed so the retries are instant.
red = '''
mkdir bin && printf '#!/bin/sh\nexit 0\n' > bin/sleep
printf '#!/bin/sh\necho "A pull request opened by hand."\n' > bin/gh && chmod +x bin/*
'''
clean = '''
mkdir bin && printf '#!/bin/sh\nexit 0\n' > bin/sleep
printf '#!/bin/sh\necho "Updates from [git push no-mistakes](https://github.com/Abhijeet34/no-mistakes)"\n' > bin/gh
chmod +x bin/*
'''
run = '''
PATH="$PWD/bin:$PATH" GH_TOKEN=stub PR_REPO=o/r PR_AUTHOR=someone PR_NUMBER=1 \
  PIPELINE_STEPS=review bash -e "$GATE"
'''
finding = "This PR was not raised through no-mistakes."

[[gate]]
id = "secret-scan-workflow"
surface = "Security"
gates = [".github/workflows/shared-secret-scan.yml", "run/secret-scan.sh", "run/secret-scan/verify.sh"]
test = ".ci/test-secret-scan.sh"
suite = "secrets"
command = "run/secret-scan/verify.sh"
red = '''
mkdir .githooks && cp "$ROOT/.gitleaks.toml" . && cp "$ROOT/.githooks/pre-push" .githooks/
cp "$ROOT/system-maintenance/git-hooks/commit-msg" .githooks/ && echo '# local edit' >> .githooks/pre-push
'''
clean = '''
mkdir .githooks && cp "$ROOT/.gitleaks.toml" . && cp "$ROOT/.githooks/pre-push" .githooks/
cp "$ROOT/system-maintenance/git-hooks/commit-msg" .githooks/
'''
# The tree under proof stands in for the gates checkout the copies are compared with.
run = 'GATES_DIR="$ROOT" bash -e "$GATE"'
finding = ".githooks/pre-push has DRIFTED from gates' canonical copy"

[[gate]]
id = "secret-scan-history"
surface = "Security"
gates = ["run/secret-scan/history.sh", "run/secret-scan/tree.sh"]
test = ".ci/test-secret-scan.sh"
suite = "secrets"
command = "run/secret-scan/history.sh"
# A secret committed and then deleted: the tree is clean, the history is not.
red = '''
git init -q -b main && cp "$ROOT/.gitleaks.toml" . && echo "print('hello')" > app.py
awk -F'\t' '$2 == "moonshot-kimi" { print $3 }' "$ROOT/.ci/gitleaks/fixtures/known-secrets.tsv" > models.py
git add -A && git commit -qm 'carries a secret' && git rm -q models.py && git commit -qm 'deletes it'
'''
clean = '''
git init -q -b main && cp "$ROOT/.gitleaks.toml" . && echo "print('hello')" > app.py
git add -A && git commit -qm clean
'''
run = 'bash -e "$GATE"'
finding = "secrets found in this repository's history"

[[gate]]
id = "watermark-scan-workflow"
surface = "Security"
gates = [".github/workflows/shared-watermark-scan.yml", ".github/workflows/watermark-scan.yml", "run/watermark-scan.sh"]
test = ".ci/test-watermark-scan-workflow.sh"
suite = "shell"
command = "run/watermark-scan.sh"
# A zero-width space, written as bytes so this file carries none.
red = '''git init -q -b main && printf 'one\xe2\x80\x8btwo\n' > notes.txt && git add -A'''
clean = '''git init -q -b main && printf 'one two\n' > notes.txt && git add -A'''
run = '''
SCANNER="$ROOT/system-maintenance/git-hooks/watermark-scan.py" \
  ALLOWLIST="$ROOT/system-maintenance/git-hooks/watermark-allow.conf" bash -e "$GATE"
'''
finding = "DETECTIVE PROVENANCE is in this repository's tree"

[[gate]]
id = "instruction-path-truth"
surface = "Instruction files"
gates = [".github/workflows/shared-instruction-truth.yml", "run/instruction-truth/path-truth.py"]
test = ".ci/test-instruction-path-truth.sh"
suite = "shell"
command = "run/instruction-truth/path-truth.py"
red = '''mkdir src && : > src/real.sh && printf 'Run `src/real.sh` or `.ci/gitleaks/sync.sh`.\n' > AGENTS.md'''
clean = '''mkdir src && : > src/real.sh && printf 'Run `src/real.sh`.\n' > AGENTS.md'''
run = 'python3 "$GATE" .'
finding = "AGENTS.md:1: `.ci/gitleaks/sync.sh` does not exist"

[[gate]]
id = "instruction-size-limit"
surface = "Instruction files"
gates = [".github/workflows/shared-instruction-truth.yml", "run/instruction-truth/size-limit.py"]
test = ".ci/test-instruction-size-limit.sh"
suite = "shell"
command = "run/instruction-truth/size-limit.py"
red = '''seq 201 > AGENTS.md'''
clean = '''seq 200 > AGENTS.md'''
run = 'python3 "$GATE" .'
finding = "AGENTS.md: 201 lines, over the 200-line limit"

# The bootstrap's controls on a caller's .github/gates.lock (README.md, "Pinning").
# .ci/fixtures/lock-fixture.sh builds a gates origin A -> B -> C with C the
# bootstrap's commit, a fork-only commit F, and a caller in the named scenario.

[[gate]]
id = "lock-imposter"
surface = "Gate pinning"
gates = ["run/lock.sh", "run/bump-identity"]
test = ".ci/test-lock.sh"
suite = "shell"
command = "run/lock.sh"
red = 'bash "$ROOT/.ci/fixtures/lock-fixture.sh" imposter'
clean = 'bash "$ROOT/.ci/fixtures/lock-fixture.sh" locked'
run = '. ./env.sh && cd caller && bash -e "$GATE"'
finding = "which is not on gates main"

[[gate]]
id = "lock-checks"
surface = "Gate pinning"
gates = ["run/lock.sh"]
test = ".ci/test-lock.sh"
suite = "shell"
command = "run/lock.sh"
red = 'bash "$ROOT/.ci/fixtures/lock-fixture.sh" unchecked'
clean = 'bash "$ROOT/.ci/fixtures/lock-fixture.sh" locked'
run = '. ./env.sh && cd caller && bash -e "$GATE"'
finding = "which has no green checks run from GitHub Actions (app 15368)"

[[gate]]
id = "lock-downgrade"
surface = "Gate pinning"
gates = ["run/lock.sh"]
test = ".ci/test-lock.sh"
suite = "shell"
command = "run/lock.sh"
red = 'bash "$ROOT/.ci/fixtures/lock-fixture.sh" downgrade'
clean = 'bash "$ROOT/.ci/fixtures/lock-fixture.sh" bump'
run = '. ./env.sh && cd caller && bash -e "$GATE"'
finding = "which does not descend from it (a downgrade)"

# A rollback is the one non-descending move a pull request may make: back to
# exactly the lock the base's lock replaced, never a step further.
[[gate]]
id = "lock-rollback"
surface = "Gate pinning"
gates = ["run/lock.sh"]
test = ".ci/test-lock.sh"
suite = "shell"
command = "run/lock.sh"
red = 'bash "$ROOT/.ci/fixtures/lock-fixture.sh" rollback-skip'
clean = 'bash "$ROOT/.ci/fixtures/lock-fixture.sh" rollback'
run = '. ./env.sh && cd caller && bash -e "$GATE"'
finding = "is not the lock the base's lock replaced (a rollback)"

[[gate]]
id = "lock-bundled"
surface = "Gate pinning"
gates = ["run/lock.sh"]
test = ".ci/test-lock.sh"
suite = "shell"
command = "run/lock.sh"
red = 'bash "$ROOT/.ci/fixtures/lock-fixture.sh" bundled'
clean = 'bash "$ROOT/.ci/fixtures/lock-fixture.sh" bump'
run = '. ./env.sh && cd caller && bash -e "$GATE"'
finding = "changes .github/gates.lock together with other content: app.py"

[[gate]]
id = "lock-author"
surface = "Gate pinning"
gates = ["run/lock.sh"]
test = ".ci/test-lock.sh"
suite = "shell"
command = "run/lock.sh"
red = 'bash "$ROOT/.ci/fixtures/lock-fixture.sh" author'
clean = 'bash "$ROOT/.ci/fixtures/lock-fixture.sh" bump'
run = '. ./env.sh && cd caller && bash -e "$GATE"'
finding = "its author someone (1) is not the bump identity"

# The copies are compared with gates at the locked commit: a caller whose copies
# are the bootstrap's or an older release's, under a lock that moved on, drifts.
[[gate]]
id = "lock-drift"
surface = "Gate pinning"
gates = ["run/secret-scan/verify.sh"]
test = ".ci/test-secret-scan.sh"
suite = "secrets"
command = "run/secret-scan/verify.sh"
red = 'bash "$ROOT/.ci/fixtures/lock-fixture.sh" drift'
clean = 'bash "$ROOT/.ci/fixtures/lock-fixture.sh" locked'
run = '. ./env.sh && cd caller && bash -e "$ROOT/run/lock.sh" && bash -e "$GATE"'
finding = ".gitleaks.toml has DRIFTED from gates' canonical copy"

[[gate]]
id = "gitleaks-rules"
surface = "Security"
gates = [".gitleaks.toml"]
test = ".ci/gitleaks/test-rules.sh"
suite = "secrets"
command = ".gitleaks.toml"
red = '''awk -F'\t' '$2 == "moonshot-kimi" { print $3 }' "$ROOT/.ci/gitleaks/fixtures/known-secrets.tsv" > models.py'''
clean = '''echo 'MODELS = {"kimi": "kimi-k2"}' > models.py'''
run = 'gitleaks dir models.py --config "$GATE" --no-banner --redact'
finding = "leaks found: 1"

[[gate]]
id = "gitleaks-sync"
surface = "Security"
gates = [".ci/gitleaks/sync.sh"]
test = ".ci/gitleaks/test-sync.sh"
suite = "shell"
command = ".ci/gitleaks/sync.sh"
red = '''
git init -q -b main caller && mkdir caller/.githooks && git -C caller config core.hooksPath .githooks
cp "$ROOT/.gitleaks.toml" caller/ && cp "$ROOT/.githooks/pre-push" "$ROOT/system-maintenance/git-hooks/commit-msg" caller/.githooks/
echo '# local edit' >> caller/.githooks/commit-msg
'''
clean = '''
git init -q -b main caller && mkdir caller/.githooks && git -C caller config core.hooksPath .githooks
cp "$ROOT/.gitleaks.toml" caller/ && cp "$ROOT/.githooks/pre-push" "$ROOT/system-maintenance/git-hooks/commit-msg" caller/.githooks/
'''
run = 'bash "$GATE" --check caller'
finding = "DRIFT caller/.githooks/commit-msg: differs from canonical"

[[gate]]
id = "repo-pre-push"
surface = "Pre-push"
gates = [".githooks/pre-push"]
test = ".ci/gitleaks/test-pre-push.sh"
suite = "secrets"
command = ".githooks/pre-push"
red = '''
git init -q -b main && cp "$ROOT/.gitleaks.toml" . && echo "print('hello')" > app.py
awk -F'\t' '$2 == "moonshot-kimi" { print $3 }' "$ROOT/.ci/gitleaks/fixtures/known-secrets.tsv" > models.py
git add -A && git commit -qm 'carries a secret'
'''
clean = '''
git init -q -b main && cp "$ROOT/.gitleaks.toml" . && echo "print('hello')" > app.py
git add -A && git commit -qm clean
'''
# The ref line git feeds a pre-push hook for a new branch; the remote is a path that has no refs.
run = '''
printf 'refs/heads/main %s refs/heads/main %040d\n' "$(git rev-parse HEAD)" 0 | bash "$GATE" origin "$PWD/none"
'''
finding = "secrets found in the commits being pushed. Push refused."

[[gate]]
id = "commit-msg"
surface = "Pre-commit"
gates = ["system-maintenance/git-hooks/commit-msg"]
test = "system-maintenance/git-hooks/test-commit-msg.sh"
suite = "shell"
command = "system-maintenance/git-hooks/commit-msg"
red = '''printf 'feat: thing\n\nCo-authored-by: Claude <noreply@anthropic.com>\n' > msg'''
clean = '''printf 'feat: thing\n\nCo-authored-by: Jane Doe <jane@example.com>\n' > msg'''
run = 'sh "$GATE" msg'
finding = "refusing agent attribution line: Co-authored-by: Claude"

[[gate]]
id = "exposure-scan"
surface = "Pre-push"
gates = ["system-maintenance/git-hooks/exposure-scan.py"]
test = "system-maintenance/git-hooks/test-exposure-scan.sh"
suite = "shell"
command = "system-maintenance/git-hooks/exposure-scan.py"
red = '''
git init -q -b main && git remote add origin https://git.example.invalid/o/r.git
echo hi > a.txt && git add -A
GIT_AUTHOR_EMAIL=jane@example.com GIT_COMMITTER_EMAIL=jane@example.com git commit -qm one
'''
clean = '''
git init -q -b main && git remote add origin https://git.example.invalid/o/r.git
echo hi > a.txt && git add -A && git commit -qm one
'''
# A local destination is judged by origin, whose host has no visibility lookup, so it is
# not proven private and a finding refuses; the local path keeps the push off the network.
run = '''
printf 'refs/heads/main %s refs/heads/main %040d\n' "$(git rev-parse HEAD)" 0 |
  python3 "$GATE" push origin "$PWD/none"
'''
finding = "IDENTITY OR MACHINE EXPOSURE"

[[gate]]
id = "artifact-scan"
surface = "Release artifacts"
gates = ["system-maintenance/git-hooks/artifact-scan.py"]
test = "system-maintenance/git-hooks/test-artifact-scan.sh"
suite = "shell"
command = "system-maintenance/git-hooks/artifact-scan.py"
# The home path is read from the account, never written here: the exposure gate refuses it in tracked text.
red = '''python3 -c 'import os, pwd; print(pwd.getpwuid(os.getuid()).pw_dir)' > home && { printf 'MZ\0'; cat home; printf '/.cargo/registry/src/x\0'; } > release.bin'''
clean = '''printf 'MZ\0/work/.cargo/registry/src/x\0' > release.bin'''
run = 'python3 "$GATE" release.bin'
finding = "machine.home-path"

[[gate]]
id = "signature-check"
surface = "Pre-push"
gates = ["system-maintenance/git-hooks/signature-check.py", "system-maintenance/git-hooks/pushrange.py"]
test = "system-maintenance/git-hooks/test-signature-check.sh"
suite = "shell"
command = "system-maintenance/git-hooks/signature-check.py"
# The same unsigned commit; only the destination ref differs. Main refuses it, a branch does not.
red = '''git init -q -b main && echo hi > a.txt && git add -A && git commit -qm unsigned && echo refs/heads/main > ref'''
clean = '''git init -q -b main && echo hi > a.txt && git add -A && git commit -qm unsigned && echo refs/heads/work > ref'''
run = '''
printf '%s %s %s %040d\n' "$(cat ref)" "$(git rev-parse HEAD)" "$(cat ref)" 0 | python3 "$GATE" push origin "$PWD/none"
'''
finding = "carry no signature"

[[gate]]
id = "watermark-scan"
surface = "Pre-push"
gates = ["system-maintenance/git-hooks/watermark-scan.py"]
test = "system-maintenance/git-hooks/test-watermark-scan.py"
suite = "secrets"
command = "system-maintenance/git-hooks/watermark-scan.py"
red = '''printf 'one\xe2\x80\x8btwo\n' > notes.txt'''
clean = '''printf 'one two\n' > notes.txt'''
run = 'python3 "$GATE" inspect notes.txt'
finding = "zero-width space [U+200B]"

[[gate]]
id = "global-pre-push"
surface = "Pre-push"
gates = ["system-maintenance/git-hooks/pre-push", "system-maintenance/git-hooks/install.sh"]
test = "system-maintenance/git-hooks/test-global-hooks.sh"
suite = "secrets"
command = "system-maintenance/git-hooks/pre-push"
# Deployed into a throwaway HOME, then a fresh clone of an allowlisted origin pushes.
red = '''
export HOME="$PWD/home" XDG_CONFIG_HOME="$PWD/home/.config" && unset GIT_CONFIG_GLOBAL && mkdir home
bash "$ROOT/system-maintenance/git-hooks/install.sh" deploy > /dev/null && echo "$PWD/up" > home/.git-hooks/pre-push-allow
git init -q --bare -b main up.git && git clone -q up.git fresh 2> /dev/null && cd fresh
awk -F'\t' '$2 == "moonshot-kimi" { print $3 }' "$ROOT/.ci/gitleaks/fixtures/known-secrets.tsv" > models.py
git add -A && git commit -qm 'carries a secret'
'''
clean = '''
export HOME="$PWD/home" XDG_CONFIG_HOME="$PWD/home/.config" && unset GIT_CONFIG_GLOBAL && mkdir home
bash "$ROOT/system-maintenance/git-hooks/install.sh" deploy > /dev/null && echo "$PWD/up" > home/.git-hooks/pre-push-allow
git init -q --bare -b main up.git && git clone -q up.git fresh 2> /dev/null && cd fresh
echo "print('hello')" > app.py && git add -A && git commit -qm clean
'''
# A branch, because main refuses the unsigned commits these inputs make (signature-check).
run = 'git push origin HEAD:refs/heads/work'
finding = "secrets found in the commits being pushed. Push refused."

[[gate]]
id = "orphan-dirs"
surface = "Pre-push"
gates = ["system-maintenance/git-hooks/check-orphan-dirs"]
test = "system-maintenance/git-hooks/test-global-hooks.sh"
suite = "secrets"
command = "system-maintenance/git-hooks/check-orphan-dirs"
red = '''
git init -q -b main && echo hi > a.txt && git add -A && git commit -qm one
mkdir notes && echo 'work nobody tracks' > notes/todo.txt
'''
clean = '''
git init -q -b main && echo hi > a.txt && git add -A && git commit -qm one
mkdir notes && echo 'work somebody tracks' > notes/todo.txt && git add -A && git commit -qm two
'''
run = 'sh "$GATE"'
finding = "orphan-dirs: 'notes/' has files on disk but ZERO tracked files"

# The runner's selector is a gate too (report 4.3, rule 3): a migration change
# whose migration gate has no verdict must not fold to pass.
[[gate]]
id = "gate-runner"
surface = "Gate runner"
gates = ["run/gate.py"]
test = ".ci/test-gate-runner.py"
suite = "shell"
command = "run/gate.py"
red = '''
git init -q -b main && mkdir -p .github migrations src && echo 'fn main() {}' > src/main.rs
printf '[[gate]]\nid = "rust"\ninputs = ["src/**"]\nrun = "true"\n\n[[gate]]\nid = "migrations"\ninputs = ["migrations/**"]\nrun = "true"\n' > .github/gates.toml
echo 'create table t (id int);' > migrations/0001.sql && git add -A && git commit -qm base && git tag base
echo 'create index i on t (id);' > migrations/0002.sql && git add -A && git commit -qm migrate
mkdir store && printf '{"gate": "rust", "head": "%s", "verdict": "pass"}\n' "$(git rev-parse HEAD)" > store/records.jsonl
'''
clean = '''
git init -q -b main && mkdir -p .github migrations src && echo 'fn main() {}' > src/main.rs
printf '[[gate]]\nid = "rust"\ninputs = ["src/**"]\nrun = "true"\n\n[[gate]]\nid = "migrations"\ninputs = ["migrations/**"]\nrun = "true"\n' > .github/gates.toml
echo 'create table t (id int);' > migrations/0001.sql && git add -A && git commit -qm base && git tag base
echo 'create index i on t (id);' > migrations/0002.sql && git add -A && git commit -qm migrate
mkdir store && printf '{"gate": "migrations", "head": "%s", "verdict": "pass"}\n' "$(git rev-parse HEAD)" > store/records.jsonl
'''
run = 'python3 "$GATE" fold --base base --store store'
finding = "FAIL migrations: no verdict for this head"

# The budget monitor's alarm is a gate too: a series at 70% of its budget must be
# named, not summarised away. README.md, "The budget monitor".
[[gate]]
id = "budget-monitor"
surface = "Gate budgets"
gates = ["run/budget-monitor.py"]
test = ".ci/test-budget-monitor.py"
suite = "shell"
command = "run/budget-monitor.py"
red = '''
mkdir bin && printf '[[budget]]\nid = "gate"\nrepo = "o/r"\nworkflow = "ci.yml"\njob = "check"\nbudget_s = 360\n' > budgets.toml
cat > bin/gh <<'EOF'
#!/bin/sh
case "$2" in
  *"/runs?"*) echo '{"id":1,"created":"2026-10-19T11:00:00Z"}' ;;
  *) echo '{"name":"check","conclusion":"success","started":"2026-10-19T11:00:00Z","completed":"2026-10-19T11:05:00Z","steps":[]}' ;;
esac
EOF
chmod +x bin/gh
'''
clean = '''
mkdir bin && printf '[[budget]]\nid = "gate"\nrepo = "o/r"\nworkflow = "ci.yml"\njob = "check"\nbudget_s = 360\n' > budgets.toml
cat > bin/gh <<'EOF'
#!/bin/sh
case "$2" in
  *"/runs?"*) echo '{"id":1,"created":"2026-10-19T11:00:00Z"}' ;;
  *) echo '{"name":"check","conclusion":"success","started":"2026-10-19T11:00:00Z","completed":"2026-10-19T11:01:40Z","steps":[]}' ;;
esac
EOF
chmod +x bin/gh
'''
run = 'PATH="$PWD/bin:$PATH" python3 "$GATE" --budgets budgets.toml --now 2026-10-19T12:00:00Z'
finding = "ALARM: p95 300 s is 83% of the 360 s budget (alarm at 70%)"

# Security design 7.2's protected surface; README.md, "The permissions-diff gate".
[[gate]]
id = "permissions-diff"
surface = "Security"
gates = ["run/permissions-diff.py"]
test = ".ci/test-permissions-diff.py"
suite = "shell"
command = "run/permissions-diff.py"
red = '''
git init -q -b main && mkdir .claude && echo '{"sandbox": {"enabled": true}}' > .claude/settings.json
echo hi > README.md && git add -A && git commit -qm base && git tag base
echo '{"sandbox": {"enabled": true, "allowUnsandboxedCommands": true}}' > .claude/settings.json
git commit -qam widen
'''
clean = '''
git init -q -b main && mkdir .claude && echo '{"sandbox": {"enabled": true}}' > .claude/settings.json
echo hi > README.md && git add -A && git commit -qm base && git tag base
echo more >> README.md && git commit -qam edit
'''
run = 'python3 "$GATE" --base base'
finding = "permissions-diff: .claude/settings.json changes Claude Code settings"

# Three document rules over one script; README.md, "The documentation rows". They
# are rows of a caller's .github/gates.toml in shadow, never a workflow step.
[[gate]]
id = "docs-owner-reader"
surface = "Documentation"
gates = ["run/docs-truth.py"]
test = ".ci/test-docs-truth.py"
suite = "shell"
command = "run/docs-truth.py"
red = '''echo '# Agents' > AGENTS.md'''
clean = '''
echo '# Agents' > AGENTS.md && mkdir .github
printf '[[doc]]\npath = "AGENTS.md"\nowner = "maintainer"\nreader = "agents"\n' > .github/docs.toml
'''
run = 'python3 "$GATE" owner .'
finding = "AGENTS.md: names no owner and reader"

[[gate]]
id = "docs-commands-run"
surface = "Documentation"
gates = ["run/docs-truth.py"]
test = ".ci/test-docs-truth.py"
suite = "shell"
command = "run/docs-truth.py"
red = '''printf '# Setup\n\n```bash\n.ci/sync.sh --check\n```\n' > README.md'''
clean = '''
printf '# Setup\n\n```bash\n.ci/sync.sh --check\n```\n' > README.md
mkdir .ci && printf '#!/bin/sh\n' > .ci/sync.sh && chmod +x .ci/sync.sh
'''
run = 'python3 "$GATE" commands .'
finding = "README.md:4: `.ci/sync.sh` does not exist"

[[gate]]
id = "docs-agents-budget"
surface = "Documentation"
gates = ["run/docs-truth.py"]
test = ".ci/test-docs-truth.py"
suite = "shell"
command = "run/docs-truth.py"
red = '''head -c 8001 /dev/zero | tr '\0' x > AGENTS.md'''
clean = '''head -c 8000 /dev/zero | tr '\0' x > AGENTS.md'''
run = 'python3 "$GATE" budget .'
finding = "AGENTS.md: 8001 bytes, over the 8000-byte budget"

# External tools pinned and run offline; README.md, "The tool rows". The inputs build
# stub tools on a PATH of their own, because the proof runs where none of the real
# ones is installed (README.md names the CI step that would install them); the real
# binaries answer the same questions in `.ci/test-tool-gates.py --real`.
[[gate]]
id = "workflow-zizmor"
surface = "Infra and CI config"
gates = ["run/tool-gates.py"]
test = ".ci/test-tool-gates.py"
suite = "shell"
command = "run/tool-gates.py"
red = '''
mkdir -p bin .github/workflows && echo 'on: push' > .github/workflows/ci.yml
printf '#!/bin/sh\n[ "$1" = --version ] && { echo "zizmor 1.29.0"; exit 0; }\nexit 13\n' > bin/zizmor && chmod +x bin/zizmor
'''
clean = '''
mkdir -p bin .github/workflows && echo 'on: push' > .github/workflows/ci.yml
printf '#!/bin/sh\n[ "$1" = --version ] && { echo "zizmor 1.29.0"; exit 0; }\nexit 0\n' > bin/zizmor && chmod +x bin/zizmor
'''
run = 'py=$(command -v python3); PATH="$PWD/bin" "$py" "$GATE" zizmor .'
finding = "tool-gates: zizmor refused the workflows (exit 13)"

[[gate]]
id = "workflow-actionlint"
surface = "Infra and CI config"
gates = ["run/tool-gates.py"]
test = ".ci/test-tool-gates.py"
suite = "shell"
command = "run/tool-gates.py"
red = '''
mkdir -p bin .github/workflows && echo 'on: push' > .github/workflows/ci.yml
printf '#!/bin/sh\n[ "$1" = --version ] && { echo 1.7.12; exit 0; }\nexit 1\n' > bin/actionlint && chmod +x bin/actionlint
'''
clean = '''
mkdir -p bin .github/workflows && echo 'on: push' > .github/workflows/ci.yml
printf '#!/bin/sh\n[ "$1" = --version ] && { echo 1.7.12; exit 0; }\nexit 0\n' > bin/actionlint && chmod +x bin/actionlint
'''
run = 'py=$(command -v python3); PATH="$PWD/bin" "$py" "$GATE" actionlint .'
finding = "tool-gates: actionlint refused the workflows (exit 1)"

# The stub exits 99 unless called with --offline, so a call that could reach the network fails.
[[gate]]
id = "advisories-osv"
surface = "Dependencies"
gates = ["run/tool-gates.py"]
test = ".ci/test-tool-gates.py"
suite = "shell"
command = "run/tool-gates.py"
red = '''
mkdir -p bin db/npm && : > db/npm/all.zip && echo '{}' > package-lock.json
printf '#!/bin/sh\n[ "$1" = --version ] && { echo "osv-scanner version: 2.7.0"; exit 0; }\ncase " $* " in *" --offline "*) exit 1 ;; esac\nexit 99\n' > bin/osv-scanner
chmod +x bin/osv-scanner
'''
clean = '''
mkdir -p bin db/npm && : > db/npm/all.zip && echo '{}' > package-lock.json
printf '#!/bin/sh\n[ "$1" = --version ] && { echo "osv-scanner version: 2.7.0"; exit 0; }\ncase " $* " in *" --offline "*) exit 0 ;; esac\nexit 99\n' > bin/osv-scanner
chmod +x bin/osv-scanner
'''
run = 'py=$(command -v python3); PATH="$PWD/bin" OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY="$PWD/db" "$py" "$GATE" osv .'
finding = "tool-gates: osv-scanner refused the tree: known vulnerabilities"

# A database older than the limit is a refusal of its own type, not a pass over old advisories.
[[gate]]
id = "advisories-osv-stale"
surface = "Dependencies"
gates = ["run/tool-gates.py"]
test = ".ci/test-tool-gates.py"
suite = "shell"
command = "run/tool-gates.py"
red = '''
mkdir -p bin db/npm && : > db/npm/all.zip && echo '{}' > package-lock.json
python3 -c "import os,time; t=time.time()-8*86400; os.utime('db/npm/all.zip',(t,t))"
printf '#!/bin/sh\n[ "$1" = --version ] && { echo "osv-scanner version: 2.7.0"; exit 0; }\nexit 0\n' > bin/osv-scanner
chmod +x bin/osv-scanner
'''
clean = '''
mkdir -p bin db/npm && : > db/npm/all.zip && echo '{}' > package-lock.json
printf '#!/bin/sh\n[ "$1" = --version ] && { echo "osv-scanner version: 2.7.0"; exit 0; }\nexit 0\n' > bin/osv-scanner
chmod +x bin/osv-scanner
'''
run = 'py=$(command -v python3); PATH="$PWD/bin" OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY="$PWD/db" "$py" "$GATE" osv .'
finding = "tool-gates: refused (stale-database)"

# An absent tool is a refusal, so a runner without zizmor cannot fold its row to a pass.
[[gate]]
