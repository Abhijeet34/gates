echo 'CREATE TABLE t (a TEXT);' > migrations/0001_t.sql && git add -A && git commit -qm base && git tag base
echo 'ALTER TABLE gone ADD COLUMN b TEXT;' > migrations/0002_b.sql && git add -A && git commit -qm change
'''
clean = '''
git init -q -b main && mkdir -p .github migrations
printf '[[migrations]]\nid = "d1"\ndir = "migrations"\ndry_run = "sqlite"\n' > .github/changes.toml
