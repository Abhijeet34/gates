suite = "shell"
command = "run/slop-rules.py"
red = '''echo '.a { color: #888; background: #999; }' > a.css'''
clean = '''echo '.a { color: #000; background: #fff; }' > a.css'''
run = 'python3 "$GATE" contrast .'
finding = "a.css:1: color #888 on #999 is 1.2:1, under 4.5:1"

[[gate]]
id = "ui-z-index"
surface = "UI standards"
gates = ["run/slop-rules.py"]
test = ".ci/test-slop-rules.py"
suite = "shell"
command = "run/slop-rules.py"
red = '''echo '.a { z-index: 9999; }' > a.css'''
clean = '''echo '.a { z-index: var(--z-modal); }' > a.css'''
run = 'python3 "$GATE" z-index .'
finding = "a.css:1: z-index: 9999 is an arbitrary z-index"

[[gate]]
id = "ui-em-dash"
surface = "UI standards"
gates = ["run/slop-rules.py"]
test = ".ci/test-slop-rules.py"
suite = "shell"
command = "run/slop-rules.py"
# The dash is written as bytes so this file carries none.
red = '''printf '<p>a \xe2\x80\x94 b</p>\n' > a.html'''
clean = '''printf '<!-- LOCAL FORK of upstream -->\n<p>a \xe2\x80\x94 b</p>\n' > a.html'''
run = 'python3 "$GATE" em-dash .'
finding = "a.html:1: carries an em dash"

[[gate]]
id = "ui-reduced-motion"
surface = "UI standards"
gates = ["run/slop-rules.py"]
test = ".ci/test-slop-rules.py"
suite = "shell"
command = "run/slop-rules.py"
red = '''echo '.a { transition: opacity 200ms; }' > a.css'''
clean = '''echo '.a { transition: opacity 200ms; }' > a.css && echo '@media (prefers-reduced-motion: reduce) { * { transition: none; } }' > b.css'''
run = 'python3 "$GATE" reduced-motion .'
finding = "a.css:1: adds motion and no file of the tree names prefers-reduced-motion"

[[gate]]
id = "gates-proof"
surface = "Gate of the gates"
gates = [".ci/gates-proof.py"]
test = ".ci/test-gates-proof.sh"
suite = "gates-proof"
command = ".ci/gates-proof.py"
# A copy of the tree with report section 2.7's neutered commit-msg hook and its
# test flipped to match. --gate, because proving every entry from inside this
# one would recurse.
red = '''
cp -R "$ROOT/." . && rm -rf .git
sed -i.orig '1a\
exit 0
' system-maintenance/git-hooks/commit-msg
sed -i.orig 's/expect refuse "\$t"/expect pass "$t"/' system-maintenance/git-hooks/test-commit-msg.sh
rm system-maintenance/git-hooks/*.orig
'''
clean = '''cp -R "$ROOT/." . && rm -rf .git'''
run = 'python3 "$GATE" --gate commit-msg .'
finding = "commit-msg: red input was not refused"

[[exempt]]
path = "system-maintenance/git-hooks/post-checkout"
reason = "git-lfs shim; gates nothing"

[[exempt]]
path = "system-maintenance/git-hooks/post-commit"
reason = "git-lfs shim; gates nothing"

[[exempt]]
path = "system-maintenance/git-hooks/post-merge"
reason = "git-lfs shim; gates nothing"

[[exempt]]
path = "run/install-gitleaks.sh"
reason = "installer; its checksum refusal runs in every job that installs gitleaks"
