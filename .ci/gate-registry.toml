# Every gate this repository ships, the surface it guards, and the inputs that
# prove it by execution; .ci/gates-proof.py runs them.
#
# `command` is the gate itself, a file. `red` and `clean` are bash that build an
# input in an empty working directory; `run` then invokes the gate on it, and
# its exit status is the verdict. The proof requires red to exit non-zero with
# `finding` in its output and clean to exit 0, then replaces `command` with
# one that exits 0 and requires red to pass, so a `run` that decides the
# verdict without the gate is refused. Each case sees ROOT (the tree under
# proof), GATE (the command's path in it; a run/ script runs as
# `bash -e "$GATE"`, as its workflow runs it) and a git with no global or
# system config and a noreply identity.
#
# `test` is the gate's fuller regression suite and `suite` the check.sh suite
# that must run it. A gate file found on disk and named neither in a `gates`
# list nor in `[[exempt]]` fails the proof too.

[[gate]]
id = "checks-verdict"
surface = "PR checks"
gates = [".ci/checks-verdict.sh", ".github/workflows/ci.yml"]
test = ".ci/test-checks-verdict.sh"
suite = "shell"
command = ".ci/checks-verdict.sh"
red = '''echo '{"shell":{"result":"skipped"},"python":{"result":"skipped"}}' > needs.json'''
clean = '''echo '{"shell":{"result":"success"},"python":{"result":"success"}}' > needs.json'''
run = 'bash "$GATE" < needs.json'
finding = "a gate did not run, or did not pass"

[[gate]]
id = "workflow-policy"
surface = "Infra and CI config"
gates = [".ci/test-workflow-policy.sh"]
test = ".ci/test-workflow-policy.sh"
suite = "shell"
command = ".ci/test-workflow-policy.sh"
red = '''mkdir wf && printf 'on:\n  pull_request_target:\n' > wf/ci.yml'''
clean = '''mkdir wf && printf 'on:\n  pull_request:\n' > wf/ci.yml'''
run = 'bash "$GATE" "$PWD/wf"'
finding = "ci.yml:2:  pull_request_target:"

[[gate]]
id = "dependency-advisories"
surface = "Dependencies"
gates = [
  ".github/workflows/shared-dependency-advisories.yml", "run/dependency-advisories.sh",
  "run/dependency-advisories/alerts.sh", "run/dependency-advisories/compare.sh",
  "run/dependency-advisories/judge.sh",
]
test = ".ci/test-dependency-advisories.sh"
suite = "shell"
command = "run/dependency-advisories/judge.sh"
red = '''
echo '[{"security_advisory": {"ghsa_id": "GHSA-aaaa-bbbb-cccc", "severity": "high"},
  "dependency": {"scope": "runtime", "package": {"name": "left-pad"}, "manifest_path": "package-lock.json"}}]' > alerts.json
'''
clean = '''
echo '[{"security_advisory": {"ghsa_id": "GHSA-aaaa-bbbb-cccc", "severity": "medium"},
  "dependency": {"scope": "runtime", "package": {"name": "left-pad"}, "manifest_path": "package-lock.json"}}]' > alerts.json
'''
run = '''
ALERTS_JSON=alerts.json COMPARE_JSON=none EVENT_NAME=push SEVERITY_FLOOR=high \
  FAIL_ON_DEVELOPMENT=false DEFERRALS_PATH=deferrals.yml bash -e "$GATE"
'''
finding = "are neither fixed nor recorded in deferrals.yml"

[[gate]]
id = "guard-generated-files"
surface = "PR checks"
gates = [".github/workflows/shared-guard-generated-files.yml", "run/guard-generated-files.sh"]
test = ".ci/test-guard-generated-files.sh"
suite = "shell"
command = "run/guard-generated-files.sh"
red = '''
git init -q -b main && echo '# Changelog' > CHANGELOG.md && echo hi > README.md
git add -A && git commit -qm base && git tag base
echo '- a hand-written entry' >> CHANGELOG.md && git commit -qam edit
'''
clean = '''
git init -q -b main && echo '# Changelog' > CHANGELOG.md && echo hi > README.md
git add -A && git commit -qm base && git tag base
echo more >> README.md && git commit -qam edit
'''
run = 'BASE_SHA=$(git rev-parse base) HEAD_SHA=$(git rev-parse HEAD) ALLOW_FIRST_ADD= bash -e "$GATE"'
finding = "This PR modifies release-please-generated files: CHANGELOG.md"

[[gate]]
id = "no-mistakes-required"
surface = "PR checks"
gates = [".github/workflows/shared-no-mistakes-required.yml", "run/no-mistakes-required.sh"]
test = ".ci/test-no-mistakes-required.sh"
suite = "shell"
command = "run/no-mistakes-required.sh"
# `gh` serves the body the step reads live; `sleep` is stubbed so the retries are instant.
red = '''
mkdir bin && printf '#!/bin/sh\nexit 0\n' > bin/sleep
printf '#!/bin/sh\necho "A pull request opened by hand."\n' > bin/gh && chmod +x bin/*
'''
clean = '''
mkdir bin && printf '#!/bin/sh\nexit 0\n' > bin/sleep
printf '#!/bin/sh\necho "Updates from [git push no-mistakes](https://github.com/Abhijeet34/no-mistakes)"\n' > bin/gh
chmod +x bin/*
'''
run = '''
PATH="$PWD/bin:$PATH" GH_TOKEN=stub PR_REPO=o/r PR_AUTHOR=someone PR_NUMBER=1 \
  PIPELINE_STEPS=review bash -e "$GATE"
'''
finding = "This PR was not raised through no-mistakes."

[[gate]]
id = "secret-scan-workflow"
surface = "Security"
gates = [".github/workflows/shared-secret-scan.yml", "run/secret-scan.sh", "run/secret-scan/verify.sh"]
test = ".ci/test-secret-scan.sh"
suite = "secrets"
command = "run/secret-scan/verify.sh"
red = '''
mkdir .githooks && cp "$ROOT/.gitleaks.toml" . && cp "$ROOT/.githooks/pre-push" .githooks/
cp "$ROOT/system-maintenance/git-hooks/commit-msg" .githooks/ && echo '# local edit' >> .githooks/pre-push
'''
clean = '''
mkdir .githooks && cp "$ROOT/.gitleaks.toml" . && cp "$ROOT/.githooks/pre-push" .githooks/
cp "$ROOT/system-maintenance/git-hooks/commit-msg" .githooks/
'''
# The tree under proof stands in for the gates checkout the copies are compared with.
run = 'GATES_DIR="$ROOT" bash -e "$GATE"'
finding = ".githooks/pre-push has DRIFTED from gates' canonical copy"

[[gate]]
id = "secret-scan-history"
surface = "Security"
gates = ["run/secret-scan/history.sh", "run/secret-scan/tree.sh"]
test = ".ci/test-secret-scan.sh"
suite = "secrets"
command = "run/secret-scan/history.sh"
# A secret committed and then deleted: the tree is clean, the history is not.
red = '''
git init -q -b main && cp "$ROOT/.gitleaks.toml" . && echo "print('hello')" > app.py
awk -F'\t' '$2 == "moonshot-kimi" { print $3 }' "$ROOT/.ci/gitleaks/fixtures/known-secrets.tsv" > models.py
git add -A && git commit -qm 'carries a secret' && git rm -q models.py && git commit -qm 'deletes it'
'''
clean = '''
git init -q -b main && cp "$ROOT/.gitleaks.toml" . && echo "print('hello')" > app.py
git add -A && git commit -qm clean
'''
run = 'bash -e "$GATE"'
finding = "secrets found in this repository's history"

[[gate]]
id = "watermark-scan-workflow"
surface = "Security"
gates = [".github/workflows/shared-watermark-scan.yml", ".github/workflows/watermark-scan.yml", "run/watermark-scan.sh"]
test = ".ci/test-watermark-scan-workflow.sh"
suite = "shell"
command = "run/watermark-scan.sh"
# A zero-width space, written as bytes so this file carries none.
red = '''git init -q -b main && printf 'one\xe2\x80\x8btwo\n' > notes.txt && git add -A'''
clean = '''git init -q -b main && printf 'one two\n' > notes.txt && git add -A'''
run = '''
SCANNER="$ROOT/system-maintenance/git-hooks/watermark-scan.py" \
  ALLOWLIST="$ROOT/system-maintenance/git-hooks/watermark-allow.conf" bash -e "$GATE"
'''
finding = "DETECTIVE PROVENANCE is in this repository's tree"

