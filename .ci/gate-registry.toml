suite = "shell"
command = "run/docs-truth.py"
red = '''printf 'a \xe2\x80\x94 b\n' > README.md'''
clean = '''printf '<!-- LOCAL FORK of an upstream skill -->\na \xe2\x80\x94 b\n' > README.md'''
run = 'python3 "$GATE" emdash .'
finding = "README.md:1: carries an em dash"

# A suite run's own temporary directory is the one place it may write; README.md, "The scratch rows".
[[gate]]
id = "scratch-guard-tree"
surface = "Clean up"
gates = ["run/scratch-guard.py"]
test = ".ci/test-scratch-guard.py"
suite = "shell"
command = "run/scratch-guard.py"
red = '''echo 'echo x > leak.txt' > cmd.sh'''
clean = '''echo 'echo x > "$TMPDIR/ok"' > cmd.sh'''
run = 'python3 "$GATE" --tree-only -- sh cmd.sh'
finding = "scratch-guard: left behind: leak.txt (tree)"

# TMPDIR is a private directory, so a stray entry in it is the command's and nobody else's.
[[gate]]
id = "scratch-guard-temp"
surface = "Clean up"
gates = ["run/scratch-guard.py"]
test = ".ci/test-scratch-guard.py"
suite = "shell"
command = "run/scratch-guard.py"
red = '''mkdir tree tmpd && echo 'echo x > "$1/stray"' > cmd.sh'''
clean = '''mkdir tree tmpd && echo 'echo x > "$TMPDIR/stray"' > cmd.sh'''
run = 'TMPDIR="$PWD/tmpd" python3 "$GATE" --root tree -- sh "$PWD/cmd.sh" "$PWD/tmpd"'
finding = "scratch-guard: left behind: stray (temp)"

# A repository's declared contracts, migrations and facts, judged against the change that
# touches them; README.md, "The change rows". Each input is a git repository with a tag `base`.
[[gate]]
id = "contract-snapshot-sources"
surface = "Public contracts"
gates = ["run/change-gates.py"]
test = ".ci/test-change-gates.py"
suite = "shell"
command = "run/change-gates.py"
red = '''
git init -q -b main && mkdir -p .github skills/cli src
printf '[[contract]]\nid = "cli"\nsnapshot = "skills/cli/SKILL.md"\nsources = ["src/**"]\n' > .github/changes.toml
echo v1 > skills/cli/SKILL.md && echo a > src/cli.js && git add -A && git commit -qm base && git tag base
echo b > src/cli.js && git commit -qam change
'''
clean = '''
git init -q -b main && mkdir -p .github skills/cli src
printf '[[contract]]\nid = "cli"\nsnapshot = "skills/cli/SKILL.md"\nsources = ["src/**"]\n' > .github/changes.toml
echo v1 > skills/cli/SKILL.md && echo a > src/cli.js && git add -A && git commit -qm base && git tag base
echo b > src/cli.js && echo v2 > skills/cli/SKILL.md && git commit -qam change
'''
run = 'python3 "$GATE" contracts --base base .'
finding = "contracts: cli: src/cli.js changed and skills/cli/SKILL.md did not"

# The other way to declare a contract: a command prints it and the snapshot must equal that.
[[gate]]
id = "contract-snapshot-command"
surface = "Public contracts"
gates = ["run/change-gates.py"]
test = ".ci/test-change-gates.py"
suite = "shell"
command = "run/change-gates.py"
red = '''
mkdir -p .github skills/cli
printf '[[contract]]\nid = "cli"\nsnapshot = "skills/cli/SKILL.md"\ncommand = "echo usage: cli --new"\n' > .github/changes.toml
echo 'usage: cli' > skills/cli/SKILL.md
'''
clean = '''
mkdir -p .github skills/cli
printf '[[contract]]\nid = "cli"\nsnapshot = "skills/cli/SKILL.md"\ncommand = "echo usage: cli --new"\n' > .github/changes.toml
echo 'usage: cli --new' > skills/cli/SKILL.md
'''
run = 'python3 "$GATE" contracts .'
finding = "contracts: cli: the output of 'echo usage: cli --new' differs from skills/cli/SKILL.md"

[[gate]]
id = "migration-immutable"
surface = "Migrations"
gates = ["run/change-gates.py"]
test = ".ci/test-change-gates.py"
suite = "shell"
command = "run/change-gates.py"
red = '''
git init -q -b main && mkdir -p .github migrations
printf '[[migrations]]\nid = "d1"\ndir = "migrations"\n' > .github/changes.toml
echo 'CREATE TABLE t (a TEXT);' > migrations/0001_t.sql && git add -A && git commit -qm base && git tag base
echo 'CREATE TABLE t (a TEXT, b TEXT);' > migrations/0001_t.sql && git commit -qam change
'''
