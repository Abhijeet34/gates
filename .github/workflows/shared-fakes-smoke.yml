name: fakes smoke (shared)

# Callable daily real smoke for a repository whose .github/fakes.toml declares a
# GitHub fake: it asks api.github.com each declared request again and fails the
# run when a fresh reply no longer has the shape the caller's recording has. A
# scheduled job cannot commit, so drift goes red here and a maintainer records
# it with `fakes.py compare --write` locally; README.md, "The fake rows", owns
# the comparison and its exit statuses.
#
# The caller supplies the trigger (a cron and workflow_dispatch) and pins this
# file like any other shared workflow; this file never runs for `gates` itself.
#
# This file is a BOOTSTRAP: the trigger, the token's permissions, the runner
# and the checkouts, which must live in a workflow file. The gate itself runs
# from the gates commit the caller's .github/gates.lock names, or from this
# file's own commit when there is no lock; README.md, "Pinning", owns the design.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  smoke:
    name: GitHub fakes must match the real API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tree and .github/gates.lock; run/lock.sh fetches more when it needs it.
          fetch-depth: 1

      # gates itself, at this workflow's own commit, beside the caller's
      # checkout. Nothing from it runs until the step below has named its
      # source, so an empty context that falls back to the caller's repository
      # is refused before the caller could supply the judge.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .gates
          # The whole of main, so run/lock.sh can decide ancestry on it.
          fetch-depth: 0
          persist-credentials: false

      # Out of the caller's tree, which the gate reads, then checked out at the
      # commit the caller's .github/gates.lock names once run/lock.sh has
      # proved it may run; README.md, "Pinning", owns the controls.
      # `job` is not an allowed context in job-level `env`, only in a step's.
      - name: Resolve the locked gates commit
        env:
          GATES_REPOSITORY: ${{ job.workflow_repository }}
          BOOTSTRAP_SHA: ${{ job.workflow_sha }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$GATES_REPOSITORY" ] && [ -n "$BOOTSTRAP_SHA" ] || {
            echo "::error::job.workflow_repository or job.workflow_sha is empty, so the gates source cannot be named." >&2
            exit 1
          }
          mv .gates "$RUNNER_TEMP/gates"
          echo "GATES_DIR=$RUNNER_TEMP/gates" >>"$GITHUB_ENV"
          GATES_DIR="$RUNNER_TEMP/gates" bash -e "$RUNNER_TEMP/gates/run/lock.sh"

      # fakes.py sends the token only under GITHUB_ACTIONS=true and only to
      # https://api.github.com, so it never reaches another host.
      - name: Compare each declared GitHub fake with the real API
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 "$GATES_DIR/run/fakes.py" compare --out "$RUNNER_TEMP/fakes-smoke"
