name: CI

# Every job that gates a merge lives in this one workflow, because the
# `checks` aggregate at the bottom can only `needs:` jobs in its own file.
# The branch ruleset (.github/ruleset-main.json) requires exactly one status,
# `checks`, so jobs here can be added or renamed without touching branch
# protection.
#
# Triggers are push, pull_request, pull_request_review, schedule and
# workflow_dispatch only; .ci/test-workflow-policy.sh refuses the triggers that would run a fork's code
# with this repository's token, and any runner that is not GitHub-hosted.
on:
  push:
    branches: [main]
  pull_request:
  # A review re-decides `checks`, so record-approval sees an approval or its
  # dismissal without a new push.
  pull_request_review:
    types: [submitted, dismissed]
  # The full-history secret scan also runs weekly, so a gitleaks rule that
  # starts firing on old history is seen without waiting for a commit.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# A superseded pull request run is noise. A superseded push run on main is
# not: it is the only record that a given merged commit was green.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Third-party actions are pinned to a commit SHA, not a tag: a tag can be
# repointed at new code by whoever owns the action.
jobs:
  shell:
    name: shell
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # exiftool because .ci/test-watermark-scan-workflow.sh drives the real
      # scanner, which refuses without an inspector.
      - name: Install the watermark gate's inspector
        run: run/apt-install.sh libimage-exiftool-perl

      # run/review.py's reproduction sandbox and run/gate.py's row sandbox (bwrap) need the user namespaces Ubuntu 24.04 restricts.
      - name: Install the review verifier's sandbox
        run: |
          run/apt-install.sh bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # `.ci/test-mutation.py --real` puts run/mutation.py to the pinned tools
      # on its fixtures only. Stryker 10 needs Node 22, and the runner's cargo
      # is its Rust toolchain. A full run over a real code base is the caller's
      # weekly schedule, never this job: README.md, "The mutation rows".
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The pin and its checksum are the README's "Pins" table.
      - name: Install cargo-mutants
        run: |
          version=27.1.0
          sha256=dfe6dc37d0342c891d2829b5a695aa57c2d0edecef7e7d0399a30cc6e206411e
          tarball=cargo-mutants-x86_64-unknown-linux-gnu.tar.gz
          cd "$(mktemp -d)"
          curl -fsSL "https://github.com/sourcefrog/cargo-mutants/releases/download/v${version}/${tarball}" -o "$tarball"
          echo "${sha256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball" cargo-mutants
          sudo install -m 0755 cargo-mutants /usr/local/bin/cargo-mutants
          cargo mutants --version

      # `.ci/test-tool-gates.py --real` puts run/tool-gates.py to the pinned tools
      # and a real npm advisory database. The pins and checksums are the README's
      # "The tool rows".
      - name: Install zizmor, actionlint and osv-scanner
        run: |
          pipx install zizmor==1.29.0
          cd "$(mktemp -d)"
          osv=osv-scanner_linux_amd64
          curl -fsSL "https://github.com/google/osv-scanner/releases/download/v2.7.0/${osv}" -o "$osv"
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  ${osv}" | sha256sum --check --strict
          sudo install -m 0755 "$osv" /usr/local/bin/osv-scanner
          tarball=actionlint_1.7.12_linux_amd64.tar.gz
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v1.7.12/${tarball}" -o "$tarball"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          zizmor --version && osv-scanner --version && actionlint --version

      # osv-scanner downloads the database of each ecosystem a lockfile names, so
      # this one-package lockfile fetches npm's and nothing else.
      - name: Download the OSV npm database
        run: |
          db="$RUNNER_TEMP/osv-db"
          cd "$(mktemp -d)"
          echo '{"lockfileVersion": 3, "packages": {"": {"name": "fx", "version": "1.0.0", "dependencies": {"lodash": "4.18.1"}}, "node_modules/lodash": {"version": "4.18.1", "resolved": "https://registry.npmjs.org/lodash/-/lodash-4.18.1.tgz"}}}' > package-lock.json
          OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY="$db" osv-scanner scan source --offline --download-offline-databases -r . || [ $? -eq 1 ]
          test -n "$(find "$db" -name all.zip)"
          echo "OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY=$db" >> "$GITHUB_ENV"

      - run: .ci/check.sh shell

  python:
    name: python
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: .ci/check.sh python

  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a credential committed and later deleted still fails.
          fetch-depth: 0

      # The pin lives in the script, which shared-secret-scan.yml runs too.
      - name: Install gitleaks
        run: run/install-gitleaks.sh

      # exiftool inspects; qpdf, ffmpeg and ImageMagick are the writers `clean`
      # uses for the formats exiftool cannot rewrite. ffmpeg stays because
      # test-watermark-scan.py generates and hashes mp3/wav/mkv with it.
      # Without recommends the set is 215 packages / 137 MiB, not 340 / 229 MiB
      # (measured 2026-10-26); the bounded step fails fast on a slow mirror
      # instead of spending the job's 15 minutes (a run stalled there 2026-10-25).
      - name: Install the watermark gate's inspector and writers
        timeout-minutes: 6
        run: run/apt-install.sh libimage-exiftool-perl qpdf ffmpeg imagemagick

      - run: .ci/check.sh secrets

  # The proof executes every gate on its red and clean inputs, so it needs each
  # gate's tools: gitleaks for the secret gates, exiftool for the watermark ones.
  gates-proof:
    name: gates proof
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pin lives in the script, which shared-secret-scan.yml runs too.
      - name: Install gitleaks
        run: run/install-gitleaks.sh

      - name: Install the watermark gate's inspector
        run: run/apt-install.sh libimage-exiftool-perl

      # run/review.py's reproduction sandbox (bwrap) needs the user namespaces Ubuntu 24.04 restricts.
      - name: Install the review verifier's sandbox
        run: |
          run/apt-install.sh bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: .ci/check.sh gates-proof

  # A change to policy/relaxations.toml passes only with the maintainer's
  # approving review at the head; README.md, "The record-approval check".
  record-approval:
    name: record approval
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The base's copy decides, so a pull request cannot pass by editing the
      # check; only a base that predates the check runs the pull request's.
      - name: Require the maintainer's approval of a relaxation record
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          check=run/record-approval.py
          if [ -n "$BASE_SHA" ]; then
            git fetch -q --depth=1 origin "$BASE_SHA"
            if git cat-file -e "$BASE_SHA:$check" 2>/dev/null; then
              git show "$BASE_SHA:$check" > "$RUNNER_TEMP/record-approval.py"
              check=$RUNNER_TEMP/record-approval.py
            fi
          fi
          python3 "$check" --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --head "$HEAD_SHA"

  # The one status the branch ruleset requires. It always runs, and it passes
  # only when every job above succeeded. Every job in this workflow must be
  # listed in `needs`; .ci/test-checks-verdict.sh fails when one is not.
  checks:
    name: checks
    needs: [shell, python, secrets, gates-proof, record-approval]
    if: ${{ always() && github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fail unless every gate ran and passed
        run: printf '%s' "$RESULTS" | .ci/checks-verdict.sh
        env:
          RESULTS: ${{ toJSON(needs) }}
