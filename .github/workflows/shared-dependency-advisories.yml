name: shared dependency advisories

# The fleet's dependency-advisory gate, called by a thin per-repo caller in the
# same shape as shared-secret-scan.yml. It reads the CALLING repository's own
# Dependabot alerts through the API rather than running any ecosystem auditor,
# so one implementation covers npm, pip, cargo and Go modules at once and
# inherits GitHub's own severity and scope labels instead of re-deriving them.
#
# Why not the ecosystem's own auditor, which is the obvious reach: a production
# filter is actively wrong here. A package whose build script bundles its
# devDependencies into the published dist ships every one of them to anyone who
# installs it, and `pnpm audit --prod` calls that tree clean. And the callers
# span JavaScript, Python, Go, Rust and Shell, so a per-ecosystem route is four
# implementations to keep in step.
#
# This is a BACKSTOP for a surface that had no owner at all, not a gate that
# stops a bad dependency arriving. Dependabot files an alert after the merge
# that introduces it; what this adds is that the alert is read by something,
# on every pull request, instead of by nobody.
#
# Those alerts describe the default branch and close only after a fix merges, so
# on a pull_request event the job also reads GitHub's dependency compare for the
# pull request, and an alert it removes without re-adding counts as fixed there.
# That read needs `contents: read`, which every caller already grants (GitHub's
# permission table, and the live runs of 2026-09-30). A private repository
# without Advanced Security answers it 403 on every pull request (measured the
# same day), so its failure fails the job only where an alert would otherwise
# fail; with no such alert it is a warning, since the answer could change nothing.
#
# Known limit: the compare only sees what the pull request's diff touches. A
# second vulnerable copy of the same package in the SAME manifest that the PR
# leaves unchanged is not in the diff, so the PR reads fixed while the alert
# stays open, and the first run on the default branch after the merge is red.
#
# The token needs no PAT. `vulnerability-alerts: read` is a documented
# GITHUB_TOKEN permission, and it was verified rather than assumed before this
# file was written - two jobs against the same endpoint: with the permission
# HTTP 200 and a JSON array, without it HTTP 403 "Resource not accessible by
# integration".
#
# THE CALLER MUST GRANT `vulnerability-alerts: read` ITSELF. A called workflow
# can narrow the caller's GITHUB_TOKEN but never widen it, so a caller that
# omits it fails the run outright with GitHub's unhelpful "workflow file issue"
# annotation - the same trap shared-no-mistakes-required.yml's callers hit over
# `pull-requests: read` (.ci/shared-workflows.md).
#
# run/dependency-advisories.sh is the gate, and .ci/test-dependency-advisories.sh
# its contract test. Nothing here is a synced copy: the deferral list is the
# caller's own policy.
#
# This file is a BOOTSTRAP: the trigger, the token's permissions, the runner
# and the checkouts, which must live in a workflow file. The gate itself runs
# from the gates commit the caller's .github/gates.lock names, or from this
# file's own commit when there is no lock; README.md, "Pinning", owns the design.
on:
  workflow_call:
    inputs:
      severity_floor:
        description: >-
          Lowest severity that fails the job: critical, high, medium or low.
          Default high, so high and critical fail. Not medium: most open
          alerts are medium, and a check that is always red is a check nobody
          reads. A repository far from clean can adopt at `critical` and
          tighten.
        type: string
        default: high
      fail_on_development:
        description: >-
          Whether an alert GitHub labels development scope can fail the job.
          Default true. Most high and critical alerts GitHub reports are
          labelled `development`, so a lenient caller can report entirely CLEAN
          while carrying critical advisories. The label is also wrong about
          what ships: a build that bundles devDependencies into the published
          dist ships them. The failure this check exists for was a scope label
          being trusted.
        type: boolean
        default: true
      deferrals_path:
        description: Path to the deferral list in the calling repository.
        type: string
        default: .github/dependency-deferrals.yml

permissions:
  contents: read
  vulnerability-alerts: read

jobs:
  advisories:
    name: dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      vulnerability-alerts: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only the deferral list is read from the tree, and it is one file.
          fetch-depth: 1

      # gates itself, at this workflow's own commit, beside the caller's
      # checkout. Nothing from it runs until the step below has named its
      # source, so an empty context that falls back to the caller's repository
      # is refused before the caller could supply the judge.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .gates
          # The whole of main, so run/lock.sh can decide ancestry on it.
          fetch-depth: 0
          persist-credentials: false

      # Out of the caller's tree, which the gate reads, then checked out at the
      # commit the caller's .github/gates.lock names once run/lock.sh has
      # proved it may run; README.md, "Pinning", owns the controls.
      # `job` is not an allowed context in job-level `env`, only in a step's.
      - name: Resolve the locked gates commit
        env:
          GATES_REPOSITORY: ${{ job.workflow_repository }}
          BOOTSTRAP_SHA: ${{ job.workflow_sha }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$GATES_REPOSITORY" ] && [ -n "$BOOTSTRAP_SHA" ] || {
            echo "::error::job.workflow_repository or job.workflow_sha is empty, so the gates source cannot be named." >&2
            exit 1
          }
          mv .gates "$RUNNER_TEMP/gates"
          echo "GATES_DIR=$RUNNER_TEMP/gates" >>"$GITHUB_ENV"
          GATES_DIR="$RUNNER_TEMP/gates" bash -e "$RUNNER_TEMP/gates/run/lock.sh"

      - name: Judge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERTS_JSON: ${{ runner.temp }}/dependabot-alerts.json
          COMPARE_JSON: ${{ runner.temp }}/dependency-compare.json
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SEVERITY_FLOOR: ${{ inputs.severity_floor }}
          FAIL_ON_DEVELOPMENT: ${{ inputs.fail_on_development }}
          DEFERRALS_PATH: ${{ inputs.deferrals_path }}
        run: bash -e "$GATES_DIR/run/dependency-advisories.sh"
