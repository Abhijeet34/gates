name: shared watermark scan

# The fleet's CI backstop for the no-watermarking gate, beside
# shared-secret-scan.yml and for the same reason: the GATE is the machine-wide
# pre-push hook, which refuses before anything reaches the remote, and this is
# what sees what the hook never did. Four things bypass it, all measured or
# structural - `git push --no-verify`, a machine with no deployed hook, any
# commit made on GitHub itself (web edit, API, Actions), and the filed
# fail-open in the repo-local chain when the global hook is absent. Nothing
# re-scanned for detective provenance after a push until this existed.
#
# SCOPE is the tree, not history, and that is the difference from the secret
# scan. A credential committed and later deleted is still published, so that
# scan must read every commit; a watermark deleted at HEAD is genuinely gone
# from the artefact anyone downloads. The tip is the artefact.
#
# A reusable workflow's steps run in the CALLER's checkout, so the scanner and
# its allowlist come from THIS workflow's own repository
# (`job.workflow_repository`), at the commit the caller's lock names or this
# workflow's own commit (`job.workflow_sha`). A caller carries no copy, and a
# copy it does carry is never the one run: the caller's tree is what is being
# judged, so it cannot also supply the judge. That checkout needs no token only
# while this repository is public; from a private one the caller's
# GITHUB_TOKEN answers `Not Found` (measured 2026-09-16), and the scan refuses
# rather than reporting a clean tree. run/watermark-scan.sh is the scan.
#
# This file is a BOOTSTRAP: the trigger, the token's permissions, the runner
# and the checkouts, which must live in a workflow file. The gate itself runs
# from the gates commit the caller's .github/gates.lock names, or from this
# file's own commit when there is no lock; README.md, "Pinning", owns the design.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  watermark-scan:
    name: watermark scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # gates itself, at this workflow's own commit, beside the caller's
      # checkout. Nothing from it runs until the step below has named its
      # source, so an empty context that falls back to the caller's repository
      # is refused before the caller could supply the judge.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .gates
          # The whole of main, so run/lock.sh can decide ancestry on it.
          fetch-depth: 0
          persist-credentials: false

      # Out of the caller's tree, which the gate reads, then checked out at the
      # commit the caller's .github/gates.lock names once run/lock.sh has
      # proved it may run; README.md, "Pinning", owns the controls.
      # `job` is not an allowed context in job-level `env`, only in a step's.
      - name: Resolve the locked gates commit
        env:
          GATES_REPOSITORY: ${{ job.workflow_repository }}
          BOOTSTRAP_SHA: ${{ job.workflow_sha }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$GATES_REPOSITORY" ] && [ -n "$BOOTSTRAP_SHA" ] || {
            echo "::error::job.workflow_repository or job.workflow_sha is empty, so the gates source cannot be named." >&2
            exit 1
          }
          mv .gates "$RUNNER_TEMP/gates"
          echo "GATES_DIR=$RUNNER_TEMP/gates" >>"$GITHUB_ENV"
          GATES_DIR="$RUNNER_TEMP/gates" bash -e "$RUNNER_TEMP/gates/run/lock.sh"

      # exiftool is the binary inspector. The scanner refuses without it rather
      # than skipping binaries, so this is not an optimisation - a run without
      # it would measure the refusal path and nothing else.
      - name: Install the binary inspector
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl

      # .ci/test-watermark-scan-workflow.sh reads these two from this file and
      # fails unless both resolve inside the gates checkout.
      - name: Scan
        env:
          SCANNER: ${{ env.GATES_DIR }}/system-maintenance/git-hooks/watermark-scan.py
          ALLOWLIST: ${{ env.GATES_DIR }}/system-maintenance/git-hooks/watermark-allow.conf
        run: bash -e "$GATES_DIR/run/watermark-scan.sh"
