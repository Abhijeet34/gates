name: watermark scan

# gates calls its own shared-watermark-scan.yml by the same-repository path,
# so a pull request that changes that workflow or the scanner runs the version
# it is changing rather than main's.
#
# There is no push trigger: the ruleset admits a commit to main only through a
# pull request, and that run scans the tree which lands.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: watermark-scan-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  watermark:
    uses: ./.github/workflows/shared-watermark-scan.yml
