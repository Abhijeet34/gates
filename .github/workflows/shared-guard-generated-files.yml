name: guard generated files (shared)

# Callable gate for repositories whose changelog release-please owns. It fails
# a pull request that hand-edits a file release-please owns.
#
# The per-repository copies this replaces had drifted into four variants, and
# each variant held a correction the others had missed. This file is their
# union:
#
#   - rename and copy detection. `git diff --name-only` sees a
#     `CHANGELOG.md -> NOTES.md` rename as a plain deletion of CHANGELOG.md and
#     a plain addition of NOTES.md, so the variants without it never reported
#     the destination path.
#   - the `A` (added) exemption, but as the `allow_first_add` input rather than
#     as a fixed rule: the copies that had it disagreed about which paths it
#     covers and each pinned its own answer in a test, so the answer is the
#     caller's to give. See the input description.
#   - the explanatory comments, which one copy had stripped.
#
# A fifth property is none of theirs: the check reads the PROVENANCE of a
# generated file's content, not only its name. All four variants were a plain
# `git diff base...head`, which cannot tell a hand edit from a fork's upstream
# sync - a merge carrying upstream's own release commits, which are exactly
# what writes these files. A legitimate sync this gate reddened could only
# merge behind an `upstream-sync` label in its caller. See the comment on the
# check body for the rule that replaces the label.
#
# A sixth is also none of theirs: a caller may carry
# `.github/generated-file-exceptions` declaring a reviewed, one-time rewrite of
# one generated file. It is a file rather than an input because an input is a
# switch someone flips per run and a file is a diff someone reads; it pins the
# blob it permits and is spent by the pull request that adds it, so it cannot
# become a standing exemption. A caller carrying no such file behaves exactly
# as it did before. See the comment on the check body.
#
# The check body, run/guard-generated-files.sh, is the single copy of this
# logic in the fleet and is exercised off a runner by
# `.ci/test-guard-generated-files.sh`.
#
# This file is a BOOTSTRAP: the trigger, the token's permissions, the runner
# and the checkouts, which must live in a workflow file. The gate itself runs
# from the gates commit the caller's .github/gates.lock names, or from this
# file's own commit when there is no lock; README.md, "Pinning", owns the design.
#
# `on: workflow_call` is the only trigger, so this workflow never runs for
# `gates` on its own - it exists to be called.

on:
  workflow_call:
    inputs:
      allow_first_add:
        description: >-
          Newline-separated generated paths whose first-ever addition is not a
          violation. A pull request that wires up release-please creates these
          files, which is not hand-editing bot-owned content; every later
          change to them is. A caller passes the paths its own tests pin, or
          nothing. A path listed here is still guarded against modification,
          deletion, rename and copy.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check:
    name: Generated files must not be hand-edited
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need history on both sides of the merge-base so `git diff base...head`
          # reflects exactly what GitHub shows as "Files changed".
          fetch-depth: 0

      # gates itself, at this workflow's own commit, beside the caller's
      # checkout. Nothing from it runs until the step below has named its
      # source, so an empty context that falls back to the caller's repository
      # is refused before the caller could supply the judge.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .gates
          # The whole of main, so run/lock.sh can decide ancestry on it.
          fetch-depth: 0
          persist-credentials: false

      # Out of the caller's tree, which the gate reads, then checked out at the
      # commit the caller's .github/gates.lock names once run/lock.sh has
      # proved it may run; README.md, "Pinning", owns the controls.
      # `job` is not an allowed context in job-level `env`, only in a step's.
      - name: Resolve the locked gates commit
        env:
          GATES_REPOSITORY: ${{ job.workflow_repository }}
          BOOTSTRAP_SHA: ${{ job.workflow_sha }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$GATES_REPOSITORY" ] && [ -n "$BOOTSTRAP_SHA" ] || {
            echo "::error::job.workflow_repository or job.workflow_sha is empty, so the gates source cannot be named." >&2
            exit 1
          }
          mv .gates "$RUNNER_TEMP/gates"
          echo "GATES_DIR=$RUNNER_TEMP/gates" >>"$GITHUB_ENV"
          GATES_DIR="$RUNNER_TEMP/gates" bash -e "$RUNNER_TEMP/gates/run/lock.sh"

      - name: Check PR does not modify release-please-generated files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ALLOW_FIRST_ADD: ${{ inputs.allow_first_add }}
        run: bash -e "$GATES_DIR/run/guard-generated-files.sh"
