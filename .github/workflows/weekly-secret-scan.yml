name: weekly secret scan

# The full-history secret scan, weekly, so a gitleaks rule that starts firing on
# old history is seen without waiting for a commit. It is not in ci.yml because
# every ci.yml run posts a `checks` run, and run/lock.sh judges a release by the
# latest `checks` run on its commit (README.md, "Pinning").
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: weekly-secret-scan-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  secrets:
    name: weekly secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a credential committed and later deleted still fails.
          fetch-depth: 0
          # The scan reads the clone and never pushes, so no token stays in it.
          persist-credentials: false

      # The pin lives in the script, which shared-secret-scan.yml runs too.
      - name: Install gitleaks
        run: run/install-gitleaks.sh

      # The same tools as ci.yml's secrets job, which says why each is there.
      - name: Install the watermark gate's inspector and writers
        timeout-minutes: 9
        run: run/apt-install.sh libimage-exiftool-perl qpdf ffmpeg imagemagick

      - run: .ci/check.sh secrets
