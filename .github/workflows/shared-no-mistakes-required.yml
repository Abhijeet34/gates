name: no-mistakes required (shared)

# Callable gate for repositories that accept pull requests only through the
# no-mistakes pipeline. Each caller used to carry its own copy of this check and
# the copies had drifted, so a correction to the marker or the failure message
# reached one repository and not the others.
#
# The split of responsibility is deliberate:
#   - the caller owns the trigger, the `paths-ignore` release-output set, the
#     concurrency group and the bot-author exemption, because all four are
#     per-repository policy and each repository's test suite asserts them in
#     its own workflow file;
#   - gates owns the check itself, run/no-mistakes-required.sh.
#
# This file is a BOOTSTRAP: the trigger, the token's permissions, the runner
# and the checkouts, which must live in a workflow file. The gate itself runs
# from the gates commit the caller's .github/gates.lock names, or from this
# file's own commit when there is no lock; README.md, "Pinning", owns the design.
#
# `on: workflow_call` is the only trigger, so this workflow never runs for
# `gates` on its own - it exists to be called.

on:
  workflow_call:
    inputs:
      pipeline_steps:
        description: >-
          The steps this repository's no-mistakes pipeline runs, named in the
          failure message only. Callers differ, "build" in one and "lint" in
          another; both wordings predate this workflow and are preserved rather
          than unified.
        type: string
        required: false
        default: review/test/lint/CI

# `pull-requests: read` is what lets the step re-read the body; a caller that
# grants only `contents: read` makes every run fail closed, because a called
# workflow can narrow the caller's token but never widen it.
permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: PR must be raised via no-mistakes
    runs-on: ubuntu-latest
    # The step sleeps between retries, so the 360-minute default is no longer
    # a harmless ceiling.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Read only for .github/gates.lock; the check reads the live body.
          fetch-depth: 1

      # gates itself, at this workflow's own commit, beside the caller's
      # checkout. Nothing from it runs until the step below has named its
      # source, so an empty context that falls back to the caller's repository
      # is refused before the caller could supply the judge.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .gates
          # The whole of main, so run/lock.sh can decide ancestry on it.
          fetch-depth: 0
          persist-credentials: false

      # Out of the caller's tree, which the gate reads, then checked out at the
      # commit the caller's .github/gates.lock names once run/lock.sh has
      # proved it may run; README.md, "Pinning", owns the controls.
      # `job` is not an allowed context in job-level `env`, only in a step's.
      - name: Resolve the locked gates commit
        env:
          GATES_REPOSITORY: ${{ job.workflow_repository }}
          BOOTSTRAP_SHA: ${{ job.workflow_sha }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$GATES_REPOSITORY" ] && [ -n "$BOOTSTRAP_SHA" ] || {
            echo "::error::job.workflow_repository or job.workflow_sha is empty, so the gates source cannot be named." >&2
            exit 1
          }
          mv .gates "$RUNNER_TEMP/gates"
          echo "GATES_DIR=$RUNNER_TEMP/gates" >>"$GITHUB_ENV"
          GATES_DIR="$RUNNER_TEMP/gates" bash -e "$RUNNER_TEMP/gates/run/lock.sh"

      - name: Verify no-mistakes signature in PR body
        env:
          GH_TOKEN: ${{ github.token }}
          PR_REPO: ${{ github.repository }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PIPELINE_STEPS: ${{ inputs.pipeline_steps }}
        run: bash -e "$GATES_DIR/run/no-mistakes-required.sh"
