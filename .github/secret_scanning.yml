# The gate's own fixtures are the canonical fake credential shapes its rules
# must fire on, so GitHub's secret scanning and push protection skip them.
# The two files by name, matching .gitleaks.toml: any other file in that
# directory is still scanned.
paths-ignore:
  - ".ci/gitleaks/fixtures/known-secrets.tsv"
  - ".ci/gitleaks/fixtures/allowlist-cases.tsv"
