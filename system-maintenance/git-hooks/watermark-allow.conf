# Deliberate exceptions to the no-watermarking gate (watermark-scan.py).
#
# Every entry must name its reason after '#', and the scanner refuses to load an
# entry that does not: the point of this file is that an exception stays VISIBLE
# - the reason is printed on every push that touches the file - rather than
# being silently excused. An open decision belongs here, worded as one.
#
# Deployed to ~/.git-hooks/watermark-allow.conf by system-maintenance/git-hooks/install.sh,
# and read from there, never from the repository being pushed.
#
# Four whitespace-separated fields, then '#' and the reason:
#
#   text  <origin-identity glob>  <path glob>   <U+XXXX[,U+XXXX-U+YYYY]...>  # why
#   blob  <origin-identity glob>  <blob sha1>   <path glob>                  # why
#
# A `text` entry lists the exact codepoints it excuses, so widening the file's
# character set is a new finding rather than a silent inheritance. A `blob`
# entry is keyed on the object's CONTENT, so a regenerated or edited asset is
# refused again under its new sha - which is what keeps a replacement from
# inheriting the exception it was meant to end.
#
# Contexts that are legitimate wherever they occur are NOT listed here: an emoji
# presentation selector after a pictographic base, and ZWJ/ZWNJ inside an emoji
# sequence or an Arabic/Indic word, are exempted structurally in the scanner,
# because a path list cannot cover files nobody has written yet.

# The RLO trick this shell function exists to CATCH: its character class holds
# the bidi and zero-width endpoints literally, so a filename-safety detector
# cannot be written without them. Defensive code, not a channel.
text  github.com/Abhijeet34/automation  system-maintenance/zsh/zshrc.d/80-archives-files.zsh  U+200B,U+200F,U+202A,U+202E,U+2066,U+2069,U+FEFF  # the detector's own character class for the photo<RLO>gnp.exe filename trick

# papertrace IS the invisible-character defence, so its evasion suite has to
# contain the attack corpus: tests/test_adversarial.py names each codepoint it
# defends against, and test_canon.py, test_offsets.py and test_similarity.py
# build documents out of them to assert the scan reports what the reader cannot
# see. Refusing a canonicaliser its own inputs is the RLO-detector problem at
# repository scale. Bounded to the invisible set a canonicaliser normalises: the
# Unicode Tags block, the noncharacters and the reserved-ignorables are
# deliberately NOT excused here, so a real channel in these files is still a
# finding.
text  github.com/Abhijeet34/papertrace  tests/test_*.py  U+00AD,U+180B-U+180F,U+200B-U+200F,U+202A-U+202E,U+2060-U+2064,U+2066-U+2069,U+3164,U+FE00-U+FE0F,U+FEFF  # the evasion suite's own attack corpus
text  github.com/Abhijeet34/papertrace  */canon.py       U+00AD,U+180B-U+180F,U+200B-U+200F,U+202A-U+202E,U+2060-U+2064,U+2066-U+2069,U+3164,U+FE00-U+FE0F,U+FEFF  # the canonicaliser's own table of the codepoints it strips (in history; removed at HEAD)
