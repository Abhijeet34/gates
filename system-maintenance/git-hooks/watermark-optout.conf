# Repositories the no-watermarking gate leaves alone, one glob per line, then
# '#' and a REASON. An entry with no reason is refused rather than honoured -
# the whole value of an opt-out list is that nobody can widen it silently.
#
# This gate is opt-OUT where the gitleaks gate beside it is opt-IN, because the
# two ask different questions. gitleaks asks whether a push leaks OUR secrets,
# which is meaningless in a third-party clone. This asks whether WE are shipping
# a machine-detectable origin mark, and every push from this machine is us
# shipping - including from a repository that does not exist yet, which no
# allowlist can name in advance.
#
# So the only entries that belong here are upstreams this machine READS rather
# than authors. A repository of ours never belongs here; a finding in one is
# answered with `watermark-scan.py clean`, or with an entry in watermark-allow.conf
# that names the decision.
#
# Matched with shell-glob semantics against the same normalised `origin`
# identity the secret-scan allowlist uses (host/owner/name, no scheme, no
# userinfo, no port, no .git), anchored at both ends.
#
# Deployed to ~/.git-hooks/watermark-optout.conf by
# system-maintenance/git-hooks/install.sh, and read from there, never from the
# repository being pushed.

gitlab.gnome.org/GNOME/*        # third-party upstream, cloned to read (meld)
github.com/zsh-users/*          # zsh plugin upstreams vendored under ~/.zinit, never authored here
github.com/zdharma-continuum/*  # the zinit plugin manager's own upstream
github.com/RustSec/*            # the RustSec advisory database, a data feed cargo-audit clones
github.com/sineto/*             # a third-party zsh plugin upstream under ~/.zinit
